name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Force stable Gradle version
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Remove deprecated android.enableR8 property
        run: |
          sed -i '/android.enableR8/d' gradle.properties || true
          cat gradle.properties

      - name: Disable minification for debug build
        run: |
          sed -i '/buildTypes/,/^    }/ s/minifyEnabled = true/minifyEnabled = false/' android/build.gradle
          sed -i '/buildTypes/,/^    }/ s/shrinkResources = true/shrinkResources = false/' android/build.gradle

      - name: Build Debug APK
        run: ./gradlew android:assembleDebug --no-daemon --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/build/outputs/apk/**/*.apk
